name: Publish to PyPI

# Runs when a GitHub Release is published, or by hand for an existing tag
# (Actions -> Publish to PyPI -> Run workflow, tag: v1.0.0).
#
# Credentials, in order of preference:
#   1. A PYPI_API_TOKEN repository (or "pypi" environment) secret: uploads
#      with that token.
#   2. No secret: PyPI trusted publishing (OIDC). Register this repository on
#      pypi.org as a trusted publisher for workflow "publish.yml" and
#      environment "pypi"; no token is stored anywhere.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Prepare distributions
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never interpolated into scripts.
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Use the release's attached files, or build them from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "terx-${VERSION}-py3-none-any.whl" \
            --pattern "terx-${VERSION}.tar.gz" || true
          if [ -f "dist/terx-${VERSION}-py3-none-any.whl" ] && [ -f "dist/terx-${VERSION}.tar.gz" ]; then
            echo "Publishing the files attached to release $TAG"
          else
            echo "Release $TAG has no attached distributions; building from the tag"
            rm -rf dist
            python -m pip install --upgrade build
            python -m build
          fi
          ls -l dist
          sha256sum dist/*

      - name: Check the distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/terx/
    permissions:
      id-token: write # Trusted publishing; unused when PYPI_API_TOKEN is set.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        # Pinned to the v1.14.3 release commit: this step handles credentials.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Empty when the secret is not set, which selects trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
